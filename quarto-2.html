<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="img/palma.png" type="image/x-icon">
    <title>Torre de Palma</title>
    <link href="https://cdn.jsdelivr.net/npm/tailwindcss@2.2.19/dist/tailwind.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/quarto-2.css">
</head>
<body class="bg-gray-100 font-sans">
    <header class="bg-white shadow-md">
        <div class="container mx-auto px-4 py-4 flex justify-center">
            <img class="h-16 w-auto" src="img/palma.png" alt="Torre de Palma Logo">
        </div>
        <nav class="bg-gray-800 text-white">
            <div class="container mx-auto px-4 py-2 flex flex-col sm:flex-row justify-center space-y-2 sm:space-y-0 sm:space-x-4">
                <a href="Index.html" class="hover:bg-gray-700 px-3 py-2 rounded">Home</a>
                <a href="Alojamento.html" class="hover:bg-gray-700 px-3 py-2 rounded">Alojamento</a>
                <a href="Restaurante.html" class="hover:bg-gray-700 px-3 py-2 rounded">Restaurante</a>
                <a href="Contatos.html" class="hover:bg-gray-700 px-3 py-2 rounded">Contatos</a>
            </div>
        </nav>
    </header>

    <main class="container mx-auto px-4 py-6">
        <div class="img-container flex flex-col sm:flex-row gap-4">
            <img src="img/quarto-2.jpg" alt="Quarto Executivo" class="w-full h-auto rounded-lg">
            <img src="img/casa-de-banho.jpg" alt="Casa de Banho" class="w-full h-auto rounded-lg">
        </div>

        <div class="titulo text-center my-6">
            <h2 class="text-2xl font-bold">Quarto Executivo</h2>
            <hr class="w-16 mx-auto border-t-2 border-gray-400">
        </div>

        <div class="main-container grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="info bg-white p-4 rounded-lg shadow">
                <span class="text font-medium">Cama</span>
                <span class="text-2 block text-gray-600">Casal</span>
            </div>
            <div class="info bg-white p-4 rounded-lg shadow">
                <span class="text font-medium">Pequeno Almoço</span>
                <span class="text-2 block text-gray-600">Sim</span>
            </div>
            <div class="info bg-white p-4 rounded-lg shadow">
                <span class="text font-medium">Wi-Fi</span>
                <span class="text-2 block text-gray-600">Sim</span>
            </div>
            <div class="info bg-white p-4 rounded-lg shadow">
                <span class="text font-medium">Serviço de Quarto</span>
                <span class="text-2 block text-gray-600">Sim</span>
            </div>
        </div>

        <div class="titulo-reservas text-center my-6">
            <h2 class="text-2xl font-bold">Reservar</h2>
            <hr class="w-16 mx-auto border-t-2 border-gray-400">
        </div>

        <div class="reservas text-center">
            <p class="text-lg mb-4">Preço atual: <span id="preco">0,00€</span></p>
            <div class="grid grid-cols-2 sm:grid-cols-4 gap-2">
                <button onclick="alterarPreco_1()" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">Noite 1</button>
                <button onclick="alterarPreco_2()" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">Noite 2</button>
                <button onclick="alterarPreco_3()" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">Noite 3</button>
                <button onclick="alterarPreco_4()" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">Noite 4</button>
                <button onclick="alterarPreco_5()" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">Noite 5</button>
                <button onclick="alterarPreco_6()" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">Noite 6</button>
                <button onclick="alterarPreco_7()" class="bg-blue-600 text-white py-2 px-4 rounded hover:bg-blue-700">Noite 7</button>
            </div>
            <div class="btn-dir mt-4 flex justify-center gap-4">
                <button id="enviar" onclick="Reservar()" class="bg-green-600 text-white py-2 px-6 rounded hover:bg-green-700">Reservar</button>
                <button onclick="limpar()" class="bg-red-600 text-white py-2 px-6 rounded hover:bg-red-700">Limpar</button>
            </div>
        </div>
    </main>

    <footer class="bg-gray-800">
        <div class="container mx-auto px-4">
            <div class="flex flex-col sm:flex-row justify-between items-center">
                <div class="footer_1 text-center sm:text-left">
                    <h2 class="sm:text-2xl font-bold">Redes Sociais</h2>
                    <div class="flex justify-center sm:justify-start gap-4">
                        <i class="fa-brands fa-instagram text-2xl"></i>
                        <i class="fa-brands fa-facebook text-2xl"></i>
                        <i class="fa-brands fa-t"></i>
                    </div>
                </div>
                <div class="footer_2 flex gap-2">
                    <img src="img/footer.jpg" alt="Footer Image 1" class="h-16 w-auto rounded">
                    <img src="img/footer1.jpg" alt="Footer Image 2" class="h-16 w-auto rounded">
                    <img src="img/footer2.jpg" alt="Footer Image 3" class="h-16 w-auto rounded">
                </div>
            </div>
        </div>
    </footer>

    <script src="Java/quarto-1.js"></script>
    <script src="https://kit.fontawesome.com/c97cbab7f2.js" crossorigin="anonymous"></script>
</body>
</html>
